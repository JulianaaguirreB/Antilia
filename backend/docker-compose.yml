services:
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: logtech
      POSTGRES_PASSWORD: logtech
      POSTGRES_DB: logtech
    ports:
      - "5432:5432"
    volumes:
      - logtech_pgdata:/var/lib/postgresql/data

volumes:
  logtech_pgdata:
